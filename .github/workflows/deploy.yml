name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for the official GitHub Pages actions: `pages: write` lets the
# deploy job publish, `id-token: write` lets it authenticate via OIDC —
# no personal access token or stored deploy secret needed.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment should run at a time; never cancel one that's
# already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Public/publishable Supabase values only (never the
          # service_role key) — supplied via repository secrets, never
          # committed here. RLS is what actually protects data access,
          # not secrecy of these values. Without these set as repo
          # secrets, the build falls back to supabaseClient.js's
          # placeholder values and the deployed site won't reach
          # Supabase at all.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
